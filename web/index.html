<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kipuka EST Server — Admin Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5/patternfly.min.css">
  <link rel="stylesheet" href="css/kipuka.css">
</head>
<body class="pf-v5-c-page">

  <!-- ── Login Overlay ──────────────────────────────────────────── -->
  <div id="login-overlay" class="kipuka-login-overlay" style="display:none;">
    <div class="pf-v5-c-card pf-m-display-lg kipuka-login-card">
      <div class="pf-v5-c-card__header">
        <div class="pf-v5-c-card__header-main">
          <div class="kipuka-login-logo">
            <svg class="kipuka-icon" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
              <circle cx="12" cy="11" r="2.5"/>
              <path d="M12 13.5v3"/>
            </svg>
            <h1 class="pf-v5-c-title pf-m-xl">Kipuka EST Server</h1>
          </div>
        </div>
      </div>
      <div class="pf-v5-c-card__body">
        <p class="pf-v5-u-mb-md pf-v5-u-color-200">Enter your admin bearer token to connect.</p>
        <div id="login-error" class="pf-v5-c-alert pf-m-danger pf-m-inline pf-v5-u-mb-md" style="display:none;">
          <div class="pf-v5-c-alert__icon">
            <svg class="pf-v5-svg" viewBox="0 0 512 512" width="16" height="16"><path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0zm-21.4 383.5c0 11.8 9.6 21.4 21.4 21.4s21.4-9.6 21.4-21.4v-21.4c0-11.8-9.6-21.4-21.4-21.4s-21.4 9.6-21.4 21.4v21.4zm0-106.7V149.3c0-11.8 9.6-21.4 21.4-21.4s21.4 9.6 21.4 21.4v127.5c0 11.8-9.6 21.4-21.4 21.4s-21.4-9.6-21.4-21.4z" fill="currentColor"/></svg>
          </div>
          <p class="pf-v5-c-alert__title" id="login-error-msg">Authentication failed</p>
        </div>
        <form id="login-form" onsubmit="return false;">
          <div class="pf-v5-c-form__group pf-v5-u-mb-md">
            <label class="pf-v5-c-form__label" for="token-input">
              <span class="pf-v5-c-form__label-text">Bearer Token</span>
            </label>
            <div class="pf-v5-c-form__group-control">
              <input
                class="pf-v5-c-form-control"
                type="password"
                id="token-input"
                placeholder="Enter admin token"
                required
                autocomplete="off"
              >
            </div>
          </div>
          <button class="pf-v5-c-button pf-m-primary pf-m-block" type="submit" id="login-btn">
            Connect
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Page Shell ─────────────────────────────────────────────── -->
  <div id="app-shell" style="display:none;">

    <!-- Masthead -->
    <header class="pf-v5-c-masthead">
      <span class="pf-v5-c-masthead__toggle">
        <button class="pf-v5-c-button pf-m-plain" id="nav-toggle" aria-label="Toggle navigation">
          <svg class="pf-v5-svg" viewBox="0 0 448 512" width="18" height="18"><path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" fill="currentColor"/></svg>
        </button>
      </span>
      <div class="pf-v5-c-masthead__main">
        <a class="pf-v5-c-masthead__brand" href="#health">
          <svg class="kipuka-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
            <circle cx="12" cy="11" r="2.5"/>
            <path d="M12 13.5v3"/>
          </svg>
          <span class="kipuka-brand-text">Kipuka EST Server</span>
        </a>
      </div>
      <div class="pf-v5-c-masthead__content">
        <div class="kipuka-masthead-right">
          <span class="pf-v5-c-label pf-m-outline pf-m-compact" id="version-label">v--</span>
          <button class="pf-v5-c-button pf-m-plain" id="logout-btn" title="Logout">
            <svg class="pf-v5-svg" viewBox="0 0 512 512" width="18" height="18"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9V320H192c-17.7 0-32-14.3-32-32V224c0-17.7 14.3-32 32-32H320V129.9c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96V64c0-35.3-28.7-64-64-64H64C28.7 0 0 28.7 0 64V448c0 35.3 28.7 64 64 64H96c35.3 0 64-28.7 64-64V416H128V448c0 17.7-14.3 32-32 32H64c-17.7 0-32-14.3-32-32V64c0-17.7 14.3-32 32-32H96c17.7 0 32 14.3 32 32V96H160z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="pf-v5-c-page__body">

      <!-- Sidebar -->
      <div class="pf-v5-c-page__sidebar pf-m-dark" id="page-sidebar">
        <div class="pf-v5-c-page__sidebar-body">
          <nav class="pf-v5-c-nav" aria-label="Main navigation">
            <ul class="pf-v5-c-nav__list" id="nav-list">
              <li class="pf-v5-c-nav__item">
                <a class="pf-v5-c-nav__link" href="#health" data-page="health">
                  <span class="pf-v5-c-nav__link-text">Health</span>
                </a>
              </li>
              <li class="pf-v5-c-nav__item">
                <a class="pf-v5-c-nav__link" href="#cas" data-page="cas">
                  <span class="pf-v5-c-nav__link-text">Certificate Authorities</span>
                </a>
              </li>
              <li class="pf-v5-c-nav__item">
                <a class="pf-v5-c-nav__link" href="#otp" data-page="otp">
                  <span class="pf-v5-c-nav__link-text">OTP Management</span>
                </a>
              </li>
              <li class="pf-v5-c-nav__item">
                <a class="pf-v5-c-nav__link" href="#certs" data-page="certs">
                  <span class="pf-v5-c-nav__link-text">Certificates</span>
                </a>
              </li>
              <li class="pf-v5-c-nav__item">
                <a class="pf-v5-c-nav__link" href="#est" data-page="est">
                  <span class="pf-v5-c-nav__link-text">EST Endpoints</span>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>

      <!-- Main content -->
      <main class="pf-v5-c-page__main" id="main-content-wrapper">
        <section class="pf-v5-c-page__main-section" id="main-content">
          <!-- Rendered by JavaScript -->
        </section>
      </main>
    </div>
  </div>

  <!-- ── OTP Modal ──────────────────────────────────────────────── -->
  <div id="otp-modal" class="pf-v5-c-modal-box pf-m-sm kipuka-modal-wrapper" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="otp-modal-title">
    <div class="kipuka-modal-backdrop" onclick="App.closeOtpModal()"></div>
    <div class="pf-v5-c-modal-box kipuka-modal-content">
      <header class="pf-v5-c-modal-box__header">
        <h1 class="pf-v5-c-modal-box__title" id="otp-modal-title">OTP Generated</h1>
      </header>
      <div class="pf-v5-c-modal-box__body">
        <div class="pf-v5-c-alert pf-m-warning pf-m-inline pf-v5-u-mb-md">
          <div class="pf-v5-c-alert__icon">
            <svg class="pf-v5-svg" viewBox="0 0 576 512" width="16" height="16"><path d="M569.5 440C588 472 564.8 512 527.9 512H48.1c-36.9 0-60-40-41.6-72L246.4 24c18.5-32 64.7-32 83.2 0l239.9 416zM288 354c-25.4 0-46 20.6-46 46s20.6 46 46 46 46-20.6 46-46-20.6-46-46-46zm-43.7-165.3l7.4 136c.3 6.4 5.6 11.3 12 11.3h48.5c6.4 0 11.6-5 12-11.3l7.4-136c.4-6.9-5.1-12.7-12-12.7h-63.4c-6.9 0-12.4 5.8-12 12.7z" fill="currentColor"/></svg>
          </div>
          <p class="pf-v5-c-alert__title">This token is shown only once. Copy it now.</p>
        </div>
        <div class="pf-v5-c-clipboard-copy pf-v5-u-mb-md">
          <div class="pf-v5-c-clipboard-copy__group">
            <input class="pf-v5-c-form-control" id="otp-token-display" type="text" readonly>
            <button class="pf-v5-c-button pf-m-control" id="otp-copy-btn" onclick="App.copyOtpToken()">Copy</button>
          </div>
        </div>
        <p id="otp-modal-entity" class="pf-v5-u-color-200"></p>
        <p id="otp-modal-expires" class="pf-v5-u-color-200"></p>
      </div>
      <footer class="pf-v5-c-modal-box__footer">
        <button class="pf-v5-c-button pf-m-primary" onclick="App.closeOtpModal()">Done</button>
      </footer>
    </div>
  </div>

  <!-- ── CA Detail Panel ────────────────────────────────────────── -->
  <div id="ca-detail-panel" class="kipuka-detail-panel" style="display:none;">
    <div class="kipuka-detail-panel-content">
      <div class="kipuka-detail-panel-header">
        <h2 class="pf-v5-c-title pf-m-lg" id="ca-detail-title">CA Details</h2>
        <button class="pf-v5-c-button pf-m-plain" onclick="App.closeCaDetail()" aria-label="Close panel">
          <svg class="pf-v5-svg" viewBox="0 0 352 512" width="16" height="16"><path d="M242.7 256l100.1-100.1c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L197.3 210.7 97.2 110.6c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L152 256 51.9 356.1c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l100.1-100.1 100.1 100.1c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L242.7 256z" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="ca-detail-body" class="pf-v5-c-description-list">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
