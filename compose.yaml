# ── Kipuka EST Server — Local Development ──────────────────────────────
#
# Self-contained local setup for issuing certificates with no external
# CA dependency (Dogtag, FreeIPA, etc.).  Kipuka signs directly using a
# test CA generated by the setup script.
#
# First time: generate test certificates
#   ./contrib/local-dev/setup-ca.sh
#
# ── Database backends ──────────────────────────────────────────────────
#
#   SQLite (default — no profile needed):
#     podman compose up
#
#   PostgreSQL:
#     podman compose --profile postgres up
#
#   MariaDB:
#     podman compose --profile mariadb up
#
#   HSM (Kryoptic PKCS#11 software token):
#     podman compose --profile hsm up
#
# Only one backend can run at a time (all kipuka variants bind port 9443).
#
# ── Quick test ─────────────────────────────────────────────────────────
#
#   curl -sk https://localhost:9443/.well-known/est/cacerts | \
#     base64 -d | openssl pkcs7 -inform DER -print_certs
#
# Enroll with OTP (once admin API issues an OTP):
#   curl -sk --cacert contrib/local-dev/ca/ca.pem \
#     -u "<identity>:<otp>" \
#     --data-binary @csr.pem \
#     -H "Content-Type: application/pkcs10" \
#     -o cert.p7 \
#     https://localhost:9443/.well-known/est/simpleenroll
#
# ────────────────────────────────────────────────────────────────────────

services:
  # ── SQLite (default) ─────────────────────────────────────────────────
  kipuka:
    # ARM64 (Apple Silicon, Graviton):
    image: registry.heebh.st/heebus/kipuka:latest-arm64
    # x86_64 — uncomment if running on Intel/AMD:
    # image: registry.heebh.st/heebus/kipuka:latest-amd64
    container_name: kipuka-est
    user: "0:0"
    ports:
      - "9443:9443"
    volumes:
      - ./contrib/local-dev/kipuka-local.toml:/etc/kipuka/kipuka.toml:ro,Z
      - ./contrib/local-dev/tls:/etc/kipuka/tls:ro,Z
      - ./contrib/local-dev/ca:/etc/kipuka/ca:ro,Z
      - ./web:/var/www/kipuka/web:ro,Z
      - kipuka-data:/var/lib/kipuka
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  # ── PostgreSQL backend ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kipuka-postgres
    profiles: [postgres]
    environment:
      POSTGRES_USER: kipuka
      POSTGRES_PASSWORD: kipuka-dev
      POSTGRES_DB: kipuka
    volumes:
      - kipuka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipuka"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kipuka-pg:
    image: registry.heebh.st/heebus/kipuka:latest-arm64
    # image: registry.heebh.st/heebus/kipuka:latest-amd64
    container_name: kipuka-est-pg
    profiles: [postgres]
    user: "0:0"
    ports:
      - "9443:9443"
    volumes:
      - ./contrib/local-dev/kipuka-postgres.toml:/etc/kipuka/kipuka.toml:ro,Z
      - ./contrib/local-dev/tls:/etc/kipuka/tls:ro,Z
      - ./contrib/local-dev/ca:/etc/kipuka/ca:ro,Z
      - ./web:/var/www/kipuka/web:ro,Z
      - kipuka-data:/var/lib/kipuka
    environment:
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── MariaDB backend ─────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: kipuka-mariadb
    profiles: [mariadb]
    environment:
      MARIADB_ROOT_PASSWORD: root-dev
      MARIADB_DATABASE: kipuka
      MARIADB_USER: kipuka
      MARIADB_PASSWORD: kipuka-dev
    volumes:
      - kipuka-mydata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kipuka-my:
    image: registry.heebh.st/heebus/kipuka:latest-arm64
    # image: registry.heebh.st/heebus/kipuka:latest-amd64
    container_name: kipuka-est-my
    profiles: [mariadb]
    user: "0:0"
    ports:
      - "9443:9443"
    volumes:
      - ./contrib/local-dev/kipuka-mariadb.toml:/etc/kipuka/kipuka.toml:ro,Z
      - ./contrib/local-dev/tls:/etc/kipuka/tls:ro,Z
      - ./contrib/local-dev/ca:/etc/kipuka/ca:ro,Z
      - ./web:/var/www/kipuka/web:ro,Z
      - kipuka-data:/var/lib/kipuka
    environment:
      - RUST_LOG=info
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  # ── Kryoptic HSM backend ──────────────────────────────────────────────
  kryoptic:
    build:
      context: ./contrib/kryoptic
      dockerfile: Containerfile
    container_name: kipuka-kryoptic
    profiles: [hsm]
    environment:
      TOKEN_LABEL: kipuka-hsm
      SO_PIN: "12345678"
      USER_PIN: "1234"
      KEY_LABEL: kipuka-ca-key
      KEY_TYPE: "rsa:3072"
    volumes:
      - kryoptic-lib:/usr/lib/pkcs11
      - kryoptic-data:/var/lib/kryoptic
    healthcheck:
      test: ["CMD-SHELL", "pkcs11-tool --module /usr/lib/pkcs11/libkryoptic_pkcs11.so --list-token-slots 2>/dev/null | grep -q kipuka-hsm"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kipuka-hsm:
    image: registry.heebh.st/heebus/kipuka:latest-arm64
    # image: registry.heebh.st/heebus/kipuka:latest-amd64
    container_name: kipuka-est-hsm
    profiles: [hsm]
    user: "0:0"
    ports:
      - "9443:9443"
    volumes:
      - ./contrib/local-dev/kipuka-hsm.toml:/etc/kipuka/kipuka.toml:ro,Z
      - ./contrib/local-dev/tls:/etc/kipuka/tls:ro,Z
      - ./contrib/local-dev/ca:/etc/kipuka/ca:ro,Z
      - ./web:/var/www/kipuka/web:ro,Z
      - kipuka-data:/var/lib/kipuka
      - kryoptic-lib:/usr/lib/pkcs11:ro
      - kryoptic-data:/var/lib/kryoptic:ro
    environment:
      - RUST_LOG=info
      - KIPUKA_HSM_PIN=1234
    depends_on:
      kryoptic:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kipuka-data:
  kipuka-pgdata:
  kipuka-mydata:
  kryoptic-lib:
  kryoptic-data:
