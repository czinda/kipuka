[package]
name = "kipuka-coap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EST over CoAP (RFC 9483) transport for constrained devices"

[dependencies]
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
bytes.workspace = true
synta-certificate.workspace = true
openssl = "0.10"
openssl-sys = "0.9"
# Must match the foreign-types major that the `openssl` crate uses (0.3),
# so `SslRef` implements the `ForeignTypeRef` trait we import for `as_ptr()`.
foreign-types = "0.3"
