[package]
name = "kipuka-dogtag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dogtag PKI CA REST API client for kipuka EST server"

[dependencies]
# native-tls delegates to the system OpenSSL (3.5+ in hummingbird runtime),
# which supports ML-DSA-87 client certs. rustls cannot parse ML-DSA signatures.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
