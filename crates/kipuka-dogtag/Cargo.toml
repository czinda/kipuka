[package]
name = "kipuka-dogtag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dogtag PKI CA REST API client for kipuka EST server"

[dependencies]
# HTTP client: hyper + hyper-openssl for full PKCS#11 control over
# the TLS client certificate (agent mTLS). OpenSSL's engine/provider
# loads the private key from PKCS#11 — key never leaves the HSM.
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
hyper-openssl = "0.10"
http-body-util = "0.1"
openssl = "0.10"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
