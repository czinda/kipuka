[package]
name = "kipuka-dogtag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dogtag PKI CA REST API client for kipuka EST server"

[dependencies]
# native-tls (OpenSSL) for Dogtag mTLS agent authentication.
# PEM-based key loading for now; PKCS#11 agent keys require
# OpenSSL 3.x provider API (engine API removed in openssl 0.10.80+).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
openssl = "0.10"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
