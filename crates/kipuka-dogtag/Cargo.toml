[package]
name = "kipuka-dogtag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dogtag PKI CA REST API client for kipuka EST server"

[dependencies]
# native-tls only — OpenSSL 3.5+ handles ALL TLS operations including
# ML-DSA-87 cert parsing and signature validation. rustls/webpki cannot
# parse ML-DSA-87 OIDs in certificate signatures.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
openssl = "0.10"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
