[package]
name = "kipuka-dogtag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dogtag PKI CA REST API client for kipuka EST server"

[dependencies]
# rustls with native-ossl crypto provider: rustls handles the TLS protocol,
# OpenSSL 3.5+ (hummingbird runtime) handles crypto including ML-DSA-87.
# Matches the akamu architecture (rustls-native-ossl).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-native-ossl = "0.1"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
parking_lot.workspace = true
