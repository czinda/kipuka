# ── Kipuka EST Server — Local Development Configuration ────────────────
#
# Minimal config for running kipuka locally with a self-signed test CA.
# Generated TLS material lives in contrib/local-dev/{tls,ca}/.
#
# Usage:
#   ./contrib/local-dev/setup-ca.sh   # generate certs (once)
#   podman compose up                 # start server
# ────────────────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────────────────
[server]
listen_addr = "0.0.0.0:9443"

# ── TLS ──────────────────────────────────────────────────────────────────
[tls]
enabled   = true
cert_file = "/etc/kipuka/tls/server.pem"
key_file  = "/etc/kipuka/tls/server-key.pem"
ca_file   = "/etc/kipuka/ca/ca.pem"

# Accept but don't require client certificates — enrollment can fall
# back to OTP authentication via HTTP Basic.
client_auth = "optional"

# ── Database ─────────────────────────────────────────────────────────────
[database]
url = "sqlite:///var/lib/kipuka/kipuka.db?mode=rwc"

# ── Certificate Authority ────────────────────────────────────────────────
# Single test CA that signs directly (no Dogtag/FreeIPA backend).
[ca]
key_file  = "/etc/kipuka/ca/ca-key.pem"
cert_file = "/etc/kipuka/ca/ca.pem"
validity_days   = 365
hash_algorithm  = "sha256"
common_name     = "Kipuka Local Dev CA"
organization    = "Kipuka Development"

# ── EST Protocol ─────────────────────────────────────────────────────────
[est]
simpleenroll   = true
simplereenroll = true
csrattrs       = true
fullcmc        = false
serverkeygen   = false

# ── OTP Enrollment Authentication ────────────────────────────────────────
[otp]
enabled         = true
storage_backend = "db"
entropy_bits    = 128
ttl_seconds     = 3600
max_usage       = 1

# ── Admin API ────────────────────────────────────────────────────────────
# Enabled with mTLS — use the agent cert generated by setup-ca.sh.
#
#   curl -sk --cert contrib/local-dev/tls/agent.pem \
#            --key  contrib/local-dev/tls/agent-key.pem \
#            --cacert contrib/local-dev/ca/ca.pem \
#            https://localhost:9443/admin/health
[admin]
enabled        = true
auth_method    = "mtls"
admin_ca_file  = "/etc/kipuka/ca/ca.pem"

# ── Audit ────────────────────────────────────────────────────────────────
# Log to stdout (container-friendly) and the database.
[audit]
enabled    = true
log_path   = "/dev/stdout"
log_to_db  = true
