# =============================================================================
# Dogtag PKI KRA subsystem — pkispawn configuration for Beaker test deployment
# =============================================================================
# Creates a KRA (Key Recovery Authority) subsystem inside the existing
# pki-tomcat instance that already hosts the CA.
#
# The KRA is installed AFTER the CA.  It joins the same security domain
# and reuses the CA's admin certificate.
#
# Usage:
#   pkispawn -f pkispawn-kra.cfg -s KRA -v
#
# Prerequisites:
#   - CA subsystem already installed in pki-tomcat (run pkispawn-ca.cfg first)
#   - 389 Directory Server instance running on localhost:389
#   - RHCS 11 / Dogtag PKI packages installed (pki-kra)
#
# WARNING: This configuration uses hardcoded test passwords.
#          Do NOT use in production.
# =============================================================================

[DEFAULT]
pki_instance_name = pki-tomcat
pki_https_port = 8443
pki_http_port = 8080

# Admin credentials (must match the CA installation)
pki_admin_password = Secret.123
pki_client_database_password = Secret.123
pki_client_pkcs12_password = Secret.123

# LDAP backend (separate suffix from the CA)
pki_ds_hostname = localhost
pki_ds_ldap_port = 389
pki_ds_password = Secret.123
pki_ds_bind_dn = cn=Directory Manager
pki_ds_base_dn = dc=kra,dc=kipuka,dc=test
pki_ds_create_new_db = True
pki_ds_remove_data = True

# Join the existing security domain hosted by the CA
pki_security_domain_hostname = localhost
pki_security_domain_https_port = 8443
pki_security_domain_password = Secret.123

[KRA]
# Reuse the CA admin certificate (already in the NSS database)
pki_admin_cert_file = /root/.dogtag/pki-tomcat/ca_admin.cert
pki_admin_nickname = PKI KRA Administrator
pki_import_admin_cert = True

# KRA storage key (for archiving private keys)
pki_storage_nickname = kra_storage
pki_storage_subject_dn = CN=Test KRA Storage,O=Kipuka Test,C=US

# KRA transport key (for wrapping keys in transit)
pki_transport_nickname = kra_transport
pki_transport_subject_dn = CN=Test KRA Transport,O=Kipuka Test,C=US

# Audit signing key
pki_audit_signing_nickname = kra_audit_signing
pki_audit_signing_subject_dn = CN=Test KRA Audit Signing,O=Kipuka Test,C=US

# Subsystem certificate
pki_subsystem_subject_dn = CN=Test KRA Subsystem,O=Kipuka Test,C=US
