# kipuka Beaker integration test configuration
# =============================================
# Production-like config for automated testing on Beaker-provisioned RHEL 9.
#
# Dogtag PKI CA is the certificate backend.  kipuka listens on port 9443
# (port 8443 is used by Dogtag itself).
#
# Field names match the Rust config structs in src/config/*.rs exactly.

# ── Server ────────────────────────────────────────────────────────────────────

[server]
listen_addr = "0.0.0.0:9443"
max_body_size = 65536
shutdown_timeout_secs = 30

# ── TLS ───────────────────────────────────────────────────────────────────────

[tls]
enabled = true
cert_file = "/etc/kipuka/tls/server.pem"
key_file = "/etc/kipuka/tls/server.key"

# Allow both mTLS and OTP-based enrollment
client_auth = "optional"
ca_file = "/etc/kipuka/tls/client-ca-bundle.pem"

min_protocol = "1.2"
max_protocol = "1.3"

# ── Database ──────────────────────────────────────────────────────────────────

[database]
url = "sqlite:///var/lib/kipuka/kipuka.db"
run_migrations = true
sqlite_wal = true

# ── Certificate Authority ─────────────────────────────────────────────────────
# Single CA backed by the Dogtag-issued signing key.
# In a production deployment, the key would reside in an HSM.

[ca]
id = "dogtag"
is_default = true
cert_file = "/etc/kipuka/ca/dogtag-ca.pem"
key_file = "/etc/kipuka/ca/test-ca.key"
key_type = "rsa:3072"
validity_days = 200
hash_algorithm = "sha256"
common_name = "Kipuka Test CA"
organization = "Kipuka Test"

# ── EST Protocol ──────────────────────────────────────────────────────────────

[est]
simpleenroll = true
simplereenroll = true
csrattrs = true
fullcmc = false
serverkeygen = false

csr_attributes = [
    "1.2.840.113549.1.9.7",
    "1.2.840.10045.4.3.2",
    "1.2.840.113549.1.1.11",
]

# ── OTP Authentication ───────────────────────────────────────────────────────

[otp]
enabled = true
entropy_bits = 128
ttl_seconds = 3600
max_usage = 1
storage_backend = "db"

# ── Admin API ─────────────────────────────────────────────────────────────────

[admin]
enabled = true
listen_addr = "127.0.0.1:9444"
auth_method = "mtls"
admin_ca_file = "/etc/kipuka/ca/test-ca.pem"
allowed_operators = ["CN=kipuka-agent,O=Kipuka Test,C=US"]
session_ttl_secs = 3600

# ── Audit Logging ─────────────────────────────────────────────────────────────

[audit]
enabled = true
log_path = "/var/log/kipuka/audit.log"
log_to_db = true
rotation_policy = "daily"
overflow_policy = "halt"
alarm_threshold = 10
alarm_action = "syslog"
