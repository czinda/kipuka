# =============================================================================
# Dogtag PKI CA subsystem — pkispawn configuration for Beaker test deployment
# =============================================================================
# Creates a CA subsystem inside the pki-tomcat instance.
# The CA uses the 389 DS instance on localhost:389 as its internal database.
#
# Usage:
#   pkispawn -f pkispawn-ca.cfg -s CA -v
#
# Prerequisites:
#   - 389 Directory Server instance running on localhost:389
#   - RHCS 11 / Dogtag PKI packages installed (pki-ca)
#
# WARNING: This configuration uses hardcoded test passwords.
#          Do NOT use in production.
# =============================================================================

[DEFAULT]
pki_instance_name = pki-tomcat
pki_https_port = 8443
pki_http_port = 8080

# Admin credentials
pki_admin_password = Secret.123
pki_client_database_password = Secret.123
pki_client_pkcs12_password = Secret.123

# LDAP backend (uses the 389 DS instance created by setup.sh)
pki_ds_hostname = localhost
pki_ds_ldap_port = 389
pki_ds_password = Secret.123
pki_ds_bind_dn = cn=Directory Manager
pki_ds_base_dn = dc=ca,dc=kipuka,dc=test
pki_ds_create_new_db = True
pki_ds_remove_data = True

# Security domain (this CA is the security domain master)
pki_security_domain_name = KIPUKA-TEST

[CA]
# Admin certificate
pki_admin_cert_file = /root/.dogtag/pki-tomcat/ca_admin.cert
pki_admin_nickname = PKI CA Administrator
pki_import_admin_cert = False

# CA signing key
pki_ca_signing_nickname = ca_signing
pki_ca_signing_subject_dn = CN=Test CA Authority,O=Kipuka Test,C=US
pki_ca_signing_key_size = 3072
pki_ca_signing_key_type = rsa
pki_ca_signing_signing_algorithm = SHA256withRSA

# OCSP signing key (embedded OCSP responder)
pki_ocsp_signing_nickname = ca_ocsp_signing
pki_ocsp_signing_subject_dn = CN=Test CA OCSP Signing,O=Kipuka Test,C=US
pki_ocsp_signing_key_size = 3072
pki_ocsp_signing_key_type = rsa
pki_ocsp_signing_signing_algorithm = SHA256withRSA

# Audit signing key
pki_audit_signing_nickname = ca_audit_signing
pki_audit_signing_subject_dn = CN=Test CA Audit Signing,O=Kipuka Test,C=US

# Subsystem certificate
pki_subsystem_subject_dn = CN=Test CA Subsystem,O=Kipuka Test,C=US

# SSL server certificate
pki_sslserver_subject_dn = CN=localhost,O=Kipuka Test,C=US

# Serial number ranges
pki_serial_number_range_start = 1
pki_serial_number_range_end = 10000000
pki_request_number_range_start = 1
pki_request_number_range_end = 10000000
