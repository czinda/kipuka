name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ── Format ─────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config clang cmake \
            libclang-dev libkrb5-dev libsqlite3-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: rustup component add clippy
      - run: cargo clippy --all-features --all-targets -- -D warnings

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config clang cmake \
            libclang-dev libkrb5-dev libsqlite3-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-
      - run: cargo build --all-features

  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config clang cmake \
            libclang-dev libkrb5-dev libsqlite3-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-
      - run: cargo test --all-features

  # ── Documentation ──────────────────────────────────────────────────────────
  doc:
    name: Documentation
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config clang cmake \
            libclang-dev libkrb5-dev libsqlite3-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

  # ── Security audit ─────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2025-0134

  # ── Dependency license check ───────────────────────────────────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone synta (sibling for [patch] resolution)
        run: git clone --depth 1 https://github.com/czinda/synta.git ../synta
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
