# =============================================================================
# cargo-deny configuration for kipuka
# =============================================================================
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ──────────────────────────────────────────────────────────────

[advisories]
version = 2
ignore = [
    # Transitive dependencies — no direct fix available, tracking upstream.
    # "RUSTSEC-2024-0436", # paste: unmaintained — removed from dep tree
    "RUSTSEC-2023-0071", # rsa: Marvin Attack timing sidechannel (transitive via rustls)
    "RUSTSEC-2025-0134", # rustls-pemfile: unmaintained (migrating to rustls-pki-types)
]

# ── Licenses ────────────────────────────────────────────────────────────────
# kipuka is GPL-3.0-or-later. Allow GPL-compatible dependency licenses.

[licenses]
version = 2
allow = [
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ring uses a non-standard license file.
exceptions = [
    { allow = ["OpenSSL"], name = "ring", version = "*" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Bans ────────────────────────────────────────────────────────────────────

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────────

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://codeberg.org/abbra/synta.git",
    "https://codeberg.org/czinda/synta.git",
]
