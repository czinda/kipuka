# =============================================================================
# cargo-deny configuration for kipuka
# =============================================================================
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ──────────────────────────────────────────────────────────────

# CI uses contrib/security/audit.py for scoped, expiring advisory exceptions.
# Running the cargo-deny advisories check directly stays strict: no blanket ignores.
[advisories]
ignore = []

# ── Licenses ────────────────────────────────────────────────────────────────
# kipuka is GPL-3.0-or-later. Allow GPL-compatible dependency licenses.

[licenses]
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

# ── Bans ────────────────────────────────────────────────────────────────────

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────────

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/czinda/synta.git",
]
