# =============================================================================
# cargo-deny configuration for kipuka
# =============================================================================
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ──────────────────────────────────────────────────────────────
# Deny any crate with a known security vulnerability or unmaintained status.

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

# ── Licenses ────────────────────────────────────────────────────────────────
# Allow only permissive licenses compatible with Apache-2.0 OR MIT.
# Deny all copyleft and restrictive licenses.

[licenses]
unlicensed = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-1.0",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "SSPL-1.0",
    "BUSL-1.1",
]
copyleft = "deny"
default = "deny"
confidence-threshold = 0.8

# ring uses a non-standard license file; declare the expression explicitly.
# The hash changes with every ring release, so use exceptions instead of
# clarify to avoid breakage on patch bumps.
exceptions = [
    { allow = ["OpenSSL"], name = "ring", version = "*" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Bans ────────────────────────────────────────────────────────────────────
# Prevent duplicate versions and known-bad crates.

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────────
# Allow crates.io and specific git repositories.

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://codeberg.org/abbra/synta.git",
]
