# =============================================================================
# cargo-deny configuration for kipuka
# =============================================================================
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ──────────────────────────────────────────────────────────────

[advisories]
version = 2
ignore = []

# ── Licenses ────────────────────────────────────────────────────────────────
# Allow only permissive licenses compatible with Apache-2.0 OR MIT.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

# ring uses a non-standard license file.
exceptions = [
    { allow = ["OpenSSL"], name = "ring", version = "*" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Bans ────────────────────────────────────────────────────────────────────

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Sources ─────────────────────────────────────────────────────────────────

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://codeberg.org/abbra/synta.git",
]
