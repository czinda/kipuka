# Verification runs for branches, merge requests, tags, and scheduled pipelines.
# A branch with an open MR uses only its MR pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [lint, build, test, security, integration, package, deploy]

variables:
  RUST_VERSION: "1.97.1"
  RUST_IMAGE: "rust:1.97.1-bookworm"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

# Native build prerequisites are mandatory: GSSAPI needs Kerberos headers/libraries.
.rust-base:
  # Independent verification continues even if a different check fails.
  needs: []
  image: ${RUST_IMAGE}
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends libssl-dev libkrb5-dev pkg-config clang cmake libclang-dev libc6-dev python3
    - rustc --version
    - python3 -c 'import os, tomllib; assert tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"] == os.environ["RUST_VERSION"]'
    - git config --global core.symlinks true

default:
  tags: [itup-alm-x86]
  image: ${RUST_IMAGE}
  cache:
    key: "rust-${RUST_VERSION}-${CI_COMMIT_REF_SLUG}"
    paths: [.cargo/registry/, .cargo/git/]
    policy: pull-push
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

include:
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/security.yml
  - local: .gitlab/ci/package.yml
  - local: .gitlab/ci/container.yml
  - local: .gitlab/ci/deploy.yml
