# =============================================================================
# Container image build — uses shell executor for direct podman access
# =============================================================================
# Builds the kipuka OCI image and pushes to quay.io.
# Requires CI variables: QUAY_USERNAME, QUAY_PASSWORD

container-build:
  stage: package
  tags:
    - shell
  variables:
    IMAGE_TAG: "quay.io/czinda/kipuka:latest"
  before_script:
    # Clone synta dependencies locally (avoids DNS issues in container builds)
    - git clone --depth 1 https://codeberg.org/abbra/synta.git synta 2>/dev/null || true
    # Replace git deps with local paths
    - sed -i 's|synta = { git = "https://codeberg.org/abbra/synta.git", branch = "main" }|synta = { path = "synta" }|' Cargo.toml
    - sed -i 's|synta-certificate = { git = "https://codeberg.org/abbra/synta.git", branch = "main", features = \["openssl"\] }|synta-certificate = { path = "synta/synta-certificate", features = ["openssl"] }|' Cargo.toml
    - 'sed -i ''s|synta-cmc = { git = "https://codeberg.org/czinda/synta.git", rev = "e1159fe" }|synta-cmc = { path = "synta/synta-cmc" }|'' Cargo.toml'
    - sed -i 's|synta-krb5 = { git = "https://codeberg.org/abbra/synta.git", branch = "main", features = \["std"\] }|synta-krb5 = { path = "synta/synta-krb5", features = ["std"] }|' Cargo.toml
    # Remove [patch] sections
    - python3 -c "import re; t=open('Cargo.toml').read(); t=re.sub(r'\[patch\.[^\]]+\][^\[]*','',t); open('Cargo.toml','w').write(t)"
    - rm -f Cargo.lock
  script:
    - podman build -t ${IMAGE_TAG} -f Containerfile .
    - echo "${QUAY_PASSWORD}" | podman login -u "${QUAY_USERNAME}" --password-stdin quay.io
    - podman push ${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "feature/sskg-kra-integration"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
