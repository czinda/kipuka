# =============================================================================
# Container image build — uses shell executor for direct podman access
# =============================================================================
# Builds the kipuka OCI image and pushes to quay.io.
# Requires CI variables: QUAY_USERNAME, QUAY_PASSWORD

container-build:
  stage: package
  tags:
    - shell
  variables:
    IMAGE_TAG: "quay.io/czinda/kipuka:latest"
  script:
    - podman build -t ${IMAGE_TAG} -f Containerfile .
    - echo "${QUAY_PASSWORD}" | podman login -u "${QUAY_USERNAME}" --password-stdin quay.io
    - podman push ${IMAGE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH == "feature/sskg-kra-integration"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
