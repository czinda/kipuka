# One publisher only. Branch/MR verification builds locally without credentials
# or a registry write. A shell runner tagged "shell" must supply Podman.
container-build:
  stage: package
  tags: [shell]
  cache: []
  script:
    - |
      set -eu
      image="quay.io/czinda/kipuka"
      local_image="localhost/kipuka-ci:${CI_JOB_ID}"
      auth_file="$(mktemp)"
      trap 'rm -f "$auth_file"; podman image rm "$local_image"' EXIT
      podman build --pull=always -t "$local_image" -f Containerfile .
      podman run --rm "$local_image" --help
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ] && { [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ] || [ -n "${CI_COMMIT_TAG:-}" ]; }; then
        : "${QUAY_USERNAME:?QUAY_USERNAME is required for publication}"
        : "${QUAY_PASSWORD:?QUAY_PASSWORD is required for publication}"
        printf '%s' "$QUAY_PASSWORD" | podman login --authfile "$auth_file" -u "$QUAY_USERNAME" --password-stdin quay.io
        podman push --authfile "$auth_file" "$local_image" "docker://${image}:${CI_COMMIT_SHA}"
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          podman push --authfile "$auth_file" "$local_image" "docker://${image}:${CI_COMMIT_TAG}"
        else
          podman push --authfile "$auth_file" "$local_image" "docker://${image}:latest"
        fi
      fi
