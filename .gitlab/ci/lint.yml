rustfmt:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  extends: .rust-base
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

shellcheck:
  stage: lint
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  cache: []
  script:
    - find contrib/ -name '*.sh' -type f -print0 | xargs -0 shellcheck --severity=warning
