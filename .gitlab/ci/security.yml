cargo-audit:
  extends: .rust-base
  stage: security
  script:
    - CARGO_PROFILE_DEV_DEBUG=0 cargo install --locked --debug --jobs 2 cargo-audit --version 0.22.1
    - python3 -B -m unittest discover -s contrib/security -p test_audit.py
    - python3 contrib/security/audit.py

cargo-deny:
  extends: .rust-base
  stage: security
  script:
    - CARGO_PROFILE_DEV_DEBUG=0 cargo install --locked --debug --jobs 2 cargo-deny --version 0.19.0
    # Advisory exceptions are evaluated by audit.py; these checks own licenses,
    # duplicate/version policy, and source provenance.
    - cargo deny --locked check licenses bans sources

# Optional internal scanner: absent unless explicitly enabled and configured.
# SARIF is retained as an artifact, not mislabeled as GitLab's different SAST JSON schema.
mantis-scan:
  stage: security
  image: python:3.12-slim
  cache: []
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git
    - pip install git+https://gitlab.cee.redhat.com/afarley/mantis.git@v0.1.0
  script:
    - mantis scan --deep --files '**/*.rs' --no-tools --config .mantis.yml --ci --sarif-output mantis-report.sarif
  artifacts:
    paths: [mantis-report.sarif]
    when: always
    expire_in: 30 days
  rules:
    - if: '$ENABLE_MANTIS == "true"'
