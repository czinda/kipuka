# =============================================================================
# Stage: security — vulnerability audit, license compliance, FIPS validation
# =============================================================================

cargo-audit:
  stage: security
  image: ${RUST_IMAGE}
  before_script:
    - cargo install --locked cargo-audit 2>/dev/null || true
  script:
    - cargo audit --deny warnings
  cache:
    key: audit-${CI_COMMIT_REF_SLUG}
    paths:
      - ${CARGO_HOME}/registry/
      - ${CARGO_HOME}/bin/cargo-audit
    policy: pull-push
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

cargo-deny-licenses:
  stage: security
  image: ${RUST_IMAGE}
  before_script:
    - cargo install --locked cargo-deny 2>/dev/null || true
  script:
    - cargo deny check licenses
    - cargo deny check advisories
    - cargo deny check bans
    - cargo deny check sources
  cache:
    key: deny-licenses-${CI_COMMIT_REF_SLUG}
    paths:
      - ${CARGO_HOME}/registry/
      - ${CARGO_HOME}/bin/cargo-deny
    policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

fips-compliance:
  stage: security
  image: ${RUST_IMAGE}
  script:
    - echo "--- FIPS algorithm validation ---"
    - cargo test --all-features -- fips --nocapture 2>&1 || true
    # Verify that the binary links against a FIPS-validated OpenSSL
    - cargo build --release --all-features
    - ldd target/release/kipuka 2>/dev/null | grep -i ssl || echo "Static link or no OpenSSL dependency detected"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
