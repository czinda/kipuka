# Assemble a source RPM; binary RPM builds remain the external COPR responsibility.
srpm-build:
  extends: .rust-base
  stage: package
  script:
    - apt-get install -y --no-install-recommends rpm
    - VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
    - mkdir -p rpmbuild/SOURCES rpmbuild/SPECS
    - git archive --format=tar.gz --prefix="kipuka-${VERSION}/" HEAD -o "rpmbuild/SOURCES/kipuka-${VERSION}.tar.gz"
    - cargo vendor --locked --versioned-dirs vendor/ > rpmbuild/SOURCES/vendor-config.toml
    - tar czf "rpmbuild/SOURCES/kipuka-${VERSION}-vendor.tar.gz" vendor/
    - cp kipuka.spec rpmbuild/SPECS/
    - rpmbuild -bs --define "_topdir ${CI_PROJECT_DIR}/rpmbuild" --define "rust_arches x86_64 aarch64" rpmbuild/SPECS/kipuka.spec
  artifacts:
    paths: [rpmbuild/SRPMS/, rpmbuild/SOURCES/vendor-config.toml]
    expire_in: 30 days

# No automatic external build submission from verification branches or arbitrary tags.
copr-submit:
  stage: deploy
  image: registry.fedoraproject.org/fedora:44
  cache: []
  dependencies: [srpm-build]
  script:
    - dnf install -y copr-cli
    - mkdir -p "$HOME/.config"
    - umask 077
    - printf '%s' "$COPR_CONFIG" > "$HOME/.config/copr"
    - trap 'rm -f "$HOME/.config/copr"' EXIT
    - copr-cli build kipuka rpmbuild/SRPMS/*.src.rpm
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $COPR_CONFIG'
      when: manual
      allow_failure: false
