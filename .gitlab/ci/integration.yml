est-interop:
  stage: integration
  image: ${RUST_IMAGE}
  timeout: 30 minutes
  script:
    - echo "--- EST interoperability tests ---"
    - echo "Validates EST protocol compliance using standard clients"
    # Build the server
    - cargo build --release --all-features
    # Generate self-signed test CA and server cert
    - mkdir -p /tmp/kipuka-interop
    - openssl req -x509 -new -nodes -newkey rsa:3072
        -keyout /tmp/kipuka-interop/ca.key
        -out /tmp/kipuka-interop/ca.pem
        -days 1 -subj "/CN=Interop Test CA"
        -addext "basicConstraints=critical,CA:TRUE"
    - openssl req -new -nodes -newkey rsa:2048
        -keyout /tmp/kipuka-interop/server.key
        -out /tmp/kipuka-interop/server.csr
        -subj "/CN=localhost"
    - openssl x509 -req -in /tmp/kipuka-interop/server.csr
        -CA /tmp/kipuka-interop/ca.pem
        -CAkey /tmp/kipuka-interop/ca.key
        -CAcreateserial
        -out /tmp/kipuka-interop/server.pem
        -days 1
        -extfile <(echo "subjectAltName=DNS:localhost,IP:127.0.0.1")
    # TODO -- start kipuka in background with test config, then run:
    # curl -sk https://localhost:9443/.well-known/est/cacerts
    # openssl s_client -connect localhost:9443 -CAfile /tmp/kipuka-interop/ca.pem
    - echo "Interop smoke framework ready -- wire up once kipuka can start without a full CA backend"
  needs:
    - job: unit-tests
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
