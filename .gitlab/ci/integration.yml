# =============================================================================
# Stage: integration — end-to-end tests with Dogtag PKI, interop tests
# =============================================================================

dogtag-integration:
  stage: integration
  image: registry.access.redhat.com/ubi9/ubi:latest
  timeout: 60 minutes
  tags:
    - privileged
  variables:
    KIPUKA_PORT: "9443"
    ADMIN_PORT: "9444"
  before_script:
    # Install build dependencies and PKI packages
    - dnf install -y
        pki-ca pki-kra 389-ds-base
        openssl openssl-devel
        gcc gcc-c++ make pkg-config
        git curl jq
        2>&1 | tail -5
    # Install Rust toolchain
    - dnf install -y rust cargo 2>/dev/null
        || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
           | sh -s -- -y --default-toolchain 1.85.0
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version && cargo --version
  script:
    # Run the Beaker setup script (provisions 389-ds, Dogtag, builds kipuka)
    - bash contrib/beaker/setup.sh --no-test
    # Run the smoke tests
    - bash contrib/beaker/smoke-test.sh
  artifacts:
    when: always
    paths:
      - /var/log/kipuka/
    expire_in: 7 days
  retry:
    max: 1
    when: runner_system_failure
  needs:
    - job: unit-tests
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

