pages:
  stage: deploy
  image: alpine:3.22
  cache: []
  script:
    - mkdir -p public
    - cp -a target/doc/. public/
    - echo '<html><head><meta http-equiv="refresh" content="0;url=kipuka/"></head></html>' > public/index.html
  artifacts:
    paths: [public]
    expire_in: 30 days
  dependencies: [build-docs]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
