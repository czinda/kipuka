---
# ansible-rulebook: the detection webhook drives the eviction sequence.
- name: Compromise indicators on a domain controller
  sources:
    - name: detection webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Evict a compromised domain controller
      condition: event.payload.alert == "compromise-indicators"
      action:
        run_playbook:
          name: playbooks/evict_dc.yml
          post_events: true
